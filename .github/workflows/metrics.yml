name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs once a day
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Knandwani07

          filename: github-metrics.svg

          # Theme
          theme: github_dark
          template: classic

          # Disable all default sections
          base: ""

          # Show only the contribution calendar
          plugin_isocalendar: yes

          # Timezone
          config_timezone: Asia/Kolkata
