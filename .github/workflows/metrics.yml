name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
       with:
  token: ${{ secrets.METRICS_TOKEN }}
  user: Knandwani07

  filename: github-metrics.svg

  template: classic
  theme: github_dark

  base: ""

  plugin_isocalendar: yes
