name: Latest Substack Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://knandwani07.substack.com/feed"
          max_post_count: 5
          user_agent: "Mozilla/5.0"
          accept_header: "application/rss+xml,application/xml,text/xml"
          retry_count: 3
          retry_wait_time: 5
